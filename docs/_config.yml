# Jekyll Configuration for Supabase Architecture Patterns Book
title: "Supabaseアーキテクチャパターン実践技術書"
description: "スケーラブルな3層構成の設計と実装 - 初心者から上級者まで段階的に学べる、Supabase完全マスターガイド"
author: "ITDO Inc.（株式会社アイティードゥ）"
version: "1.0.0"
license: "CC-BY-NC-SA-4.0"
homepage: "https://itdojp.github.io/supabase-architecture-patterns-book/"
lang: "ja"
url: "https://itdojp.github.io"
baseurl: "/supabase-architecture-patterns-book"
repository: "https://github.com/itdojp/supabase-architecture-patterns-book"

# Build settings
markdown: kramdown
highlighter: rouge
theme: null

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - LICENSE
  - package.json
  - package-lock.json
  - src/

# Permalink configuration
permalink: pretty

# Collections and defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "book"