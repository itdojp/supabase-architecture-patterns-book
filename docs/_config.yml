title: "Supabaseアーキテクチャパターン実践技術書"
description: "スケーラブルな3層構成の設計と実装 - 初心者から上級者まで段階的に学べる、Supabase完全マスターガイド"
author: "ITDO Inc.（株式会社アイティードゥ）"
version: "1.0.0"
lang: "ja"

# Jekyll設定
markdown: kramdown
highlighter: rouge

# プラグイン
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# GitHub Pages設定
baseurl: "/supabase-architecture-patterns-book"
url: "https://itdojp.github.io"

repository: 
  github: "https://github.com/itdojp/supabase-architecture-patterns-book"

# ビルド設定
exclude:
  - README.md
  - package.json
  - package-lock.json
  - node_modules/
  - scripts/
  - .gitignore
  - LICENSE
  - CONTRIBUTING.md
  - src/
  - vendor/
  - Gemfile
  - Gemfile.lock

# v3.0 Design System Configuration
markdown: kramdown
highlighter: rouge
permalink: pretty
plugins:
  - jekyll-feed
  - jekyll-sitemap

# GitHub Pages compatibility

# Use custom book layout as default
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "book"

# Ensure Jekyll processes the site correctly
safe: true
source: .
destination: ./_site