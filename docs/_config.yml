# Jekyll設定
title: "Supabaseアーキテクチャパターン実践技術書"
description: "スケーラブルな3層構成の設計と実装 - 初心者から上級者まで段階的に学べる、Supabase完全マスターガイド"
author: 
  name: "株式会社アイティードゥ"
  github: itdojp
  email: knowledge@itdo.jp
baseurl: "/supabase-architecture-patterns-book"
url: "https://itdojp.github.io"

# Repository settings for links
repository:
  github: itdojp/supabase-architecture-patterns-book  # GitHub repository path
  zenn: books/supabase-architecture-patterns          # Zenn book path

# plugins:
#   - jekyll-feed

# 言語設定
lang: ja

# その他の設定
show_downloads: false
google_analytics:

# ビルド設定
exclude:
  - README.md
  - package.json
  - package-lock.json
  - node_modules/
  - scripts/
  - .gitignore
  - LICENSE
  - CONTRIBUTING.md
  - src/
  - vendor/
  - Gemfile
  - Gemfile.lock

# v3.0 Design System Configuration
markdown: kramdown
highlighter: rouge
permalink: pretty
plugins:
  - jekyll-feed
  - jekyll-sitemap

# GitHub Pages compatibility

# Use custom book layout as default
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "book"

# Ensure Jekyll processes the site correctly
safe: true
source: .
destination: ./_site