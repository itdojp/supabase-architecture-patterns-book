<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="700" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji'; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .layer-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji'; font-size: 14px; font-weight: bold; fill: #fff; }
      .service-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji'; font-size: 12px; font-weight: bold; fill: #2c3e50; }
      .text-content { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji'; font-size: 11px; fill: #2c3e50; }
      .small-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji'; font-size: 10px; fill: #7f8c8d; }
      .client-layer { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .api-layer { fill: #2ecc71; stroke: #27ae60; stroke-width: 2; }
      .auth-layer { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; }
      .database-layer { fill: #f39c12; stroke: #e67e22; stroke-width: 2; }
      .storage-layer { fill: #9b59b6; stroke: #8e44ad; stroke-width: 2; }
      .realtime-layer { fill: #1abc9c; stroke: #16a085; stroke-width: 2; }
      .component { fill: #fff; stroke: #95a5a6; stroke-width: 1; }
      .flow-arrow { stroke: #34495e; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .bidirectional-arrow { stroke: #34495e; stroke-width: 2; fill: none; marker-start: url(#arrowhead); marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#34495e"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" class="title" text-anchor="middle">Supabaseアーキテクチャ全体像</text>

  <!-- Client Layer -->
  <g id="client-layer">
    <rect x="50" y="60" width="800" height="80" class="client-layer" rx="10"/>
    <text x="450" y="85" class="layer-title" text-anchor="middle">クライアントアプリケーション層</text>
    
    <rect x="70" y="95" width="110" height="35" class="component" rx="3"/>
    <text x="125" y="115" class="text-content" text-anchor="middle">Web App</text>
    
    <rect x="200" y="95" width="110" height="35" class="component" rx="3"/>
    <text x="255" y="115" class="text-content" text-anchor="middle">Mobile App</text>
    
    <rect x="330" y="95" width="110" height="35" class="component" rx="3"/>
    <text x="385" y="115" class="text-content" text-anchor="middle">Desktop App</text>
    
    <rect x="460" y="95" width="110" height="35" class="component" rx="3"/>
    <text x="515" y="115" class="text-content" text-anchor="middle">IoT Device</text>
    
    <rect x="590" y="95" width="110" height="35" class="component" rx="3"/>
    <text x="645" y="115" class="text-content" text-anchor="middle">Third-party</text>
    
    <rect x="720" y="95" width="110" height="35" class="component" rx="3"/>
    <text x="775" y="115" class="text-content" text-anchor="middle">CLI Tools</text>
  </g>

  <!-- API Gateway Layer -->
  <g id="api-layer">
    <rect x="200" y="170" width="500" height="80" class="api-layer" rx="10"/>
    <text x="450" y="195" class="layer-title" text-anchor="middle">API Gateway (Kong)</text>
    
    <rect x="220" y="205" width="100" height="35" class="component" rx="3"/>
    <text x="270" y="225" class="text-content" text-anchor="middle">REST API</text>
    
    <rect x="340" y="205" width="100" height="35" class="component" rx="3"/>
    <text x="390" y="225" class="text-content" text-anchor="middle">GraphQL</text>
    
    <rect x="460" y="205" width="100" height="35" class="component" rx="3"/>
    <text x="510" y="225" class="text-content" text-anchor="middle">WebSocket</text>
    
    <rect x="580" y="205" width="100" height="35" class="component" rx="3"/>
    <text x="630" y="225" class="text-content" text-anchor="middle">Rate Limit</text>
  </g>

  <!-- Core Services -->
  <g id="core-services">
    <!-- Authentication Service -->
    <rect x="50" y="280" width="200" height="120" class="auth-layer" rx="10"/>
    <text x="150" y="305" class="layer-title" text-anchor="middle">認証サービス</text>
    <text x="150" y="325" class="layer-title" text-anchor="middle">(GoTrue)</text>
    
    <rect x="65" y="335" width="80" height="25" class="component" rx="3"/>
    <text x="105" y="352" class="small-text" text-anchor="middle">JWT</text>
    
    <rect x="155" y="335" width="80" height="25" class="component" rx="3"/>
    <text x="195" y="352" class="small-text" text-anchor="middle">OAuth</text>
    
    <rect x="65" y="365" width="80" height="25" class="component" rx="3"/>
    <text x="105" y="382" class="small-text" text-anchor="middle">MFA</text>
    
    <rect x="155" y="365" width="80" height="25" class="component" rx="3"/>
    <text x="195" y="382" class="small-text" text-anchor="middle">RBAC</text>
    
    <!-- Database Service -->
    <rect x="280" y="280" width="200" height="120" class="database-layer" rx="10"/>
    <text x="380" y="305" class="layer-title" text-anchor="middle">データベース</text>
    <text x="380" y="325" class="layer-title" text-anchor="middle">(PostgreSQL)</text>
    
    <rect x="295" y="335" width="80" height="25" class="component" rx="3"/>
    <text x="335" y="352" class="small-text" text-anchor="middle">RLS</text>
    
    <rect x="385" y="335" width="80" height="25" class="component" rx="3"/>
    <text x="425" y="352" class="small-text" text-anchor="middle">Trigger</text>
    
    <rect x="295" y="365" width="80" height="25" class="component" rx="3"/>
    <text x="335" y="382" class="small-text" text-anchor="middle">Function</text>
    
    <rect x="385" y="365" width="80" height="25" class="component" rx="3"/>
    <text x="425" y="382" class="small-text" text-anchor="middle">Extension</text>
    
    <!-- Realtime Service -->
    <rect x="510" y="280" width="160" height="120" class="realtime-layer" rx="10"/>
    <text x="590" y="305" class="layer-title" text-anchor="middle">リアルタイム</text>
    <text x="590" y="325" class="layer-title" text-anchor="middle">(Realtime)</text>
    
    <rect x="525" y="335" width="130" height="25" class="component" rx="3"/>
    <text x="590" y="352" class="small-text" text-anchor="middle">Broadcast</text>
    
    <rect x="525" y="365" width="130" height="25" class="component" rx="3"/>
    <text x="590" y="382" class="small-text" text-anchor="middle">Presence</text>
    
    <!-- Storage Service -->
    <rect x="700" y="280" width="140" height="120" class="storage-layer" rx="10"/>
    <text x="770" y="305" class="layer-title" text-anchor="middle">ストレージ</text>
    <text x="770" y="325" class="layer-title" text-anchor="middle">(Storage)</text>
    
    <rect x="715" y="335" width="110" height="25" class="component" rx="3"/>
    <text x="770" y="352" class="small-text" text-anchor="middle">S3互換</text>
    
    <rect x="715" y="365" width="110" height="25" class="component" rx="3"/>
    <text x="770" y="382" class="small-text" text-anchor="middle">CDN</text>
  </g>

  <!-- Edge Functions -->
  <g id="edge-functions">
    <rect x="200" y="430" width="500" height="70" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2" rx="10"/>
    <text x="450" y="455" class="layer-title" text-anchor="middle">Edge Functions (Deno)</text>
    
    <rect x="220" y="465" width="100" height="25" class="component" rx="3"/>
    <text x="270" y="482" class="small-text" text-anchor="middle">TypeScript</text>
    
    <rect x="340" y="465" width="100" height="25" class="component" rx="3"/>
    <text x="390" y="482" class="small-text" text-anchor="middle">Webhooks</text>
    
    <rect x="460" y="465" width="100" height="25" class="component" rx="3"/>
    <text x="510" y="482" class="small-text" text-anchor="middle">Cron Jobs</text>
    
    <rect x="580" y="465" width="100" height="25" class="component" rx="3"/>
    <text x="630" y="482" class="small-text" text-anchor="middle">Custom API</text>
  </g>

  <!-- Infrastructure Layer -->
  <g id="infrastructure">
    <rect x="50" y="530" width="800" height="140" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" rx="5"/>
    <text x="450" y="555" class="service-title" text-anchor="middle">インフラストラクチャ層</text>
    
    <!-- Monitoring -->
    <rect x="70" y="570" width="160" height="80" fill="#e6f3ff" stroke="#3498db" stroke-width="1" rx="3"/>
    <text x="150" y="590" class="text-content" text-anchor="middle">監視・ログ</text>
    <text x="80" y="610" class="small-text">• Logflare</text>
    <text x="80" y="625" class="small-text">• Metrics</text>
    <text x="80" y="640" class="small-text">• Alerting</text>
    
    <!-- Security -->
    <rect x="250" y="570" width="160" height="80" fill="#ffe6e6" stroke="#e74c3c" stroke-width="1" rx="3"/>
    <text x="330" y="590" class="text-content" text-anchor="middle">セキュリティ</text>
    <text x="260" y="610" class="small-text">• SSL/TLS</text>
    <text x="260" y="625" class="small-text">• Encryption</text>
    <text x="260" y="640" class="small-text">• Firewall</text>
    
    <!-- Backup -->
    <rect x="430" y="570" width="160" height="80" fill="#e6ffe6" stroke="#2ecc71" stroke-width="1" rx="3"/>
    <text x="510" y="590" class="text-content" text-anchor="middle">バックアップ</text>
    <text x="440" y="610" class="small-text">• PITR</text>
    <text x="440" y="625" class="small-text">• Snapshot</text>
    <text x="440" y="640" class="small-text">• Replication</text>
    
    <!-- Scaling -->
    <rect x="610" y="570" width="160" height="80" fill="#fff3cd" stroke="#f39c12" stroke-width="1" rx="3"/>
    <text x="690" y="590" class="text-content" text-anchor="middle">スケーリング</text>
    <text x="620" y="610" class="small-text">• Auto-scaling</text>
    <text x="620" y="625" class="small-text">• Load Balance</text>
    <text x="620" y="640" class="small-text">• CDN</text>
  </g>

  <!-- Connection Arrows -->
  <path d="M 450 140 L 450 170" class="flow-arrow"/>
  <path d="M 450 250 L 450 280" class="flow-arrow"/>
  <path d="M 150 250 L 150 280" class="flow-arrow"/>
  <path d="M 750 250 L 770 280" class="flow-arrow"/>
  <path d="M 450 400 L 450 430" class="flow-arrow"/>
  <path d="M 450 500 L 450 530" class="flow-arrow"/>
</svg>