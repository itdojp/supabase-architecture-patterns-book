name: Docs Forbidden Check

on:
  pull_request:
  push:
    branches: [ main ]

env:
  # Temporary opt-in during GitHub Actions' Node 20 -> Node 24 transition.
  # Ref: https://github.blog/changelog/2026-03-06-github-actions-transitions-from-node-20-to-node-24/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  docs-forbidden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check forbidden items in docs
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            "docs/project-management"
            "docs/src"
            "docs/package.json"
            "docs/node_modules"
          )
          for path in "${forbidden[@]}"; do
            if [ -e "$path" ]; then
              echo "Forbidden path exists: $path"
              exit 1
            fi
          done
          echo "docs forbidden items: OK"
